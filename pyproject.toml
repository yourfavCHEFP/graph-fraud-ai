[project]
name = "graph-fraud-ai"
version = "1.0.0"
description = "Heterogeneous graph neural network fraud detection on IEEE-CIS"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
