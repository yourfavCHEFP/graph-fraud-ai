services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MODEL_CHECKPOINT_PATH: models/production/graphsage_improved.pt
      MODEL_REGISTRY_PATH: models/registry/model_registry.json
      GRAPH_PATH: data/graph/fraud_graph_ready.pt
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
