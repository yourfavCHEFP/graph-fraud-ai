services:
  - type: web
    name: graph-fraud-ai-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready

    envVars:
      - key: APP_ENV
        value: production

      - key: API_HOST
        value: 0.0.0.0

      - key: API_PORT
        value: 8000

      - key: ALLOW_ORIGINS
        value: "*"

      - key: MODEL_REGISTRY_PATH
        value: models/registry/model_registry.json

      - key: MODEL_CHECKPOINT_PATH
        value: models/production/graphsage_improved.pt

      - key: GRAPH_PATH
        value: data/graph/fraud_graph_ready.pt

      # No FRAUD_THRESHOLD_OVERRIDE set: the checkpoint's own
      # validation_threshold is authoritative (see src/inference/predictor.py).
      # Previously this had DEFAULT_FRAUD_THRESHOLD=0.5, which silently
      # overrode the checkpoint's real tuned threshold (0.26) -- meaning
      # production was NOT using the threshold the evaluated metrics were
      # computed at. Only set FRAUD_THRESHOLD_OVERRIDE here if you have a
      # deliberate, documented operational reason to deviate from the
      # checkpoint's tuned value.
